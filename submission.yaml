submission:
  title: "PRAVAHA — Power Grid Outage Prediction & Machine Health Advisory"

  problem_statement: >
    Modern electrical distribution grids suffer from catastrophic unpredicted transformer failures and storm-induced outages, causing millions in industrial downtime and grid instability. Utility dispatchers lack unified real-time telemetry analytics and physics-informed ML risk scoring to proactively prevent critical asset breakdowns.

  solution_summary: >
    PRAVAHA is an AI-powered intelligent power-grid monitoring and failure-prediction platform. It combines trained Gradient Boosting and Random Forest Dissolved Gas Analysis (DGA) ML ensembles with multi-output regional outage risk classifiers, automated maintenance dispatch planning, and real-time SCADA telemetry visualization.

  key_features:
    - "Trained DGA ML ensemble (GradientBoosting & RandomForest) for equipment health index and remaining useful life estimation"
    - "Multi-output weather & load-induced grid outage risk classifier with downtime estimation"
    - "Multi-machine asset monitoring with independent IEEE/CIGRE risk scoring and DGA gas concentration breakdown"
    - "Automated preventative maintenance recommendation and crew dispatch planning"
    - "Full-stack reactive operational dashboard with real-time sensor streams and historical incident intelligence"

  tech_stack:
    languages: ["Python", "JavaScript", "SQL"]
    frameworks: ["FastAPI", "React", "Vite", "Scikit-Learn"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["PostgreSQL", "Supabase"]
    other: ["Pandas", "Joblib", "TailwindCSS / Glassmorphic UI", "Docker"]

  what_we_are_most_proud_of: >
    The end-to-end integration of trained Dissolved Gas Analysis (DGA) physicochemical machine learning models with real-time transformer telemetry and multi-machine asset isolation, giving power grid operators explainable risk attribution and automated crew dispatch recommendations.

  known_limitations: >
    Grid simulation feeds currently simulate real-world telemetry streams at configured sample rates; direct hardware RTU / DNP3 protocol bridge is scaffolded for future enterprise hardware rollout.

